[project]
name = "causeway"
version = "0.2.0"
description = "A root cause analyzer for distributed systems."
readme = "README.md"
authors = [
    { name = "Rupeshwar Rao", email = "raorupesh24@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "matplotlib>=3.11.2",
    "networkx>=3.6.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["slow: exercises the full API pipeline including Granger causality tests"]
addopts = "-m 'not slow'"
